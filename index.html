<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Daily Board</title>
<style>
  :root{
    --bg:#0f1117; --card:#1a1d2e; --card2:#232640; --border:#2e3154;
    --text:#e2e8f0; --muted:#8892a4;
    --danger:#ef4444; --danger-bg:rgba(239,68,68,.14);
    --safe:#22c55e; --safe-bg:rgba(34,197,94,.12);
    --neutral:#94a3b8; --accent:#6366f1; --accent2:#a78bfa; --gold:#f59e0b; --warn:#f97316;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.5}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
  header h1{font-size:19px;font-weight:700;letter-spacing:.5px}
  header h1 span{color:var(--accent2)}
  #update-time{font-size:12px;color:var(--muted)}
  .container{max-width:1280px;margin:0 auto;padding:22px 24px 60px}
  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:30px 0 14px;display:flex;align-items:center;gap:8px}
  .section-title:first-child{margin-top:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
  .subtle{color:var(--muted);font-size:12px}

  /* 平衡杆 */
  .gauge-wrap{position:relative;padding:20px 10px 6px}
  .gauge-track{position:relative;height:16px;border-radius:9px;background:linear-gradient(90deg,var(--safe) 0%,#64748b 50%,var(--danger) 100%);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
  .gauge-mid{position:absolute;top:-6px;left:50%;width:2px;height:28px;background:var(--muted);transform:translateX(-50%);opacity:.6}
  .gauge-needle{position:absolute;top:-10px;width:4px;height:36px;background:#fff;border-radius:3px;box-shadow:0 0 8px rgba(255,255,255,.7);transform:translateX(-50%);transition:left .6s ease}
  .gauge-val{position:absolute;top:-42px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:3px 10px;border-radius:8px;font-weight:700;font-size:15px;white-space:nowrap}
  .gauge-labels{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}
  .gauge-labels .l{color:var(--safe)} .gauge-labels .m{color:var(--muted)} .gauge-labels .r{color:var(--danger)}
  .dist-row{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
  .dist-pill{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card2)}

  /* AGI 时间轴 */
  .agi-axis{position:relative;margin:120px 12px 20px;height:2px;background:var(--border)}
  .agi-tick{position:absolute;top:-6px;width:1px;height:14px;background:var(--muted);opacity:.5}
  .agi-tick span{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
  .agi-pt{position:absolute;top:-7px;transform:translateX(-50%);cursor:default}
  .agi-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--border)}
  .agi-pt .lbl{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;background:var(--card2);border:1px solid var(--border);padding:2px 7px;border-radius:6px}
  .agi-noyear{margin-top:14px;font-size:12px;color:var(--muted)}
  .agi-noyear b{color:var(--text)}

  /* 方向 news */
  .dir-block{margin-bottom:18px}
  .dir-head{font-size:14px;font-weight:700;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .dir-head .cnt{font-size:11px;color:var(--muted);font-weight:400}
  .news-item{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .news-item:last-child{border-bottom:none}
  .news-item a{color:var(--text);text-decoration:none;font-weight:600;font-size:14px}
  .news-item a:hover{color:var(--accent2)}
  .news-meta{font-size:11px;color:var(--muted);margin:2px 0}
  .news-sum{font-size:12.5px;color:#b8c0d0}
  .score-badge{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:0 6px;font-size:11px;color:var(--gold);margin-left:6px}

  /* KOL 卡 */
  .kol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .kol-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;border-left:4px solid var(--neutral)}
  .kol-card.s2{border-left-color:var(--danger)} .kol-card.s1{border-left-color:var(--warn)}
  .kol-card.s0{border-left-color:var(--neutral)} .kol-card.sm1{border-left-color:#4ade80} .kol-card.sm2{border-left-color:var(--safe)}
  .kol-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .kol-name{font-size:15px;font-weight:700}.kol-name small{color:var(--muted);font-weight:400;font-size:11px}
  .kol-rating{color:var(--gold);font-size:12px;white-space:nowrap}
  .kol-role{font-size:11.5px;color:var(--muted);margin:3px 0 8px}
  .kol-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tag{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--card2);border:1px solid var(--border)}
  .tag.danger{color:var(--danger);border-color:rgba(239,68,68,.4)}
  .tag.safe{color:var(--safe);border-color:rgba(34,197,94,.4)}
  .tag.agi{color:var(--accent2)}
  .kol-view{font-size:12.5px;color:#c5ccda;margin-bottom:8px}
  .kol-basis{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--border);padding-top:7px}
  .kol-basis a{color:var(--accent);text-decoration:none}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px;padding-top:18px;border-top:1px solid var(--border)}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}

  /* LMArena 榜 */
  .lm-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .lm-tab{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:13px;cursor:pointer;font-weight:600}
  .lm-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lm-row{display:grid;grid-template-columns:38px 1fr 62px 82px 74px;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
  .lm-row.head{color:var(--muted);font-size:11px;font-weight:700;border-bottom:1px solid var(--border);position:sticky}
  .lm-rank{font-weight:700;text-align:center}
  .lm-model{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lm-model small{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px}
  .lm-score{font-weight:700;color:var(--accent2);text-align:right}
  .lm-delta{font-size:12px;text-align:center}
  .lm-up{color:var(--safe)} .lm-down{color:var(--danger)} .lm-flat{color:var(--muted)} .lm-new{color:var(--gold);font-weight:700}
  .lm-stale{color:var(--warn);font-size:11px}

  /* 里程碑时间线(竖向) */
  .tl-line{position:relative;padding-left:26px}
  .tl-line::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
  .tl-item{position:relative;padding:0 0 18px 0}
  .tl-item::before{content:'';position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--border)}
  .tl-date{font-size:12px;color:var(--gold);font-weight:700}
  .tl-title{font-size:14px;font-weight:600;margin:2px 0}
  .tl-title a{color:var(--text);text-decoration:none}
  .tl-title a:hover{color:var(--accent2)}
  .tl-impact{font-size:12.5px;color:#b8c0d0}
</style>
</head>

function renderLM(lm){
  document.getElementById('lmDate').textContent=lm.generated_at_jst+' · '+lm.compare_window;
  const cats=lm.categories; const slugs=Object.keys(cats);
  const tabs=document.getElementById('lmTabs'); const tbl=document.getElementById('lmTable');
  const note=document.getElementById('lmNote');
  function draw(slug){
    [...tabs.children].forEach(t=>t.classList.toggle('active',t.dataset.slug===slug));
    const c=cats[slug];
    let h=`<div class="lm-row head"><span>#</span><span>模型</span><span style="text-align:right">Elo</span><span style="text-align:center">排名Δ</span><span style="text-align:center">分数Δ</span></div>`;
    if(!c.rows||!c.rows.length){ h+=`<div class="empty">暂无数据（${c.error||'抓取失败'}）</div>`; }
    c.rows.forEach(r=>{
      let rd,sd;
      if(r.is_new){rd='<span class="lm-new">NEW</span>';}
      else if(r.rank_delta===null||r.rank_delta===undefined){rd='<span class="lm-flat">—</span>';}
      else if(r.rank_delta>0){rd=`<span class="lm-up">↑${r.rank_delta}</span>`;}
      else if(r.rank_delta<0){rd=`<span class="lm-down">↓${-r.rank_delta}</span>`;}
      else{rd='<span class="lm-flat">─</span>';}
      if(r.score_delta===null||r.score_delta===undefined){sd='<span class="lm-flat">—</span>';}
      else if(r.score_delta>0){sd=`<span class="lm-up">+${r.score_delta}</span>`;}
      else if(r.score_delta<0){sd=`<span class="lm-down">${r.score_delta}</span>`;}
      else{sd='<span class="lm-flat">0</span>';}
      h+=`<div class="lm-row"><span class="lm-rank">${r.rank}</span>`+
        `<span class="lm-model">${r.model}<small>${r.org||''}</small></span>`+
        `<span class="lm-score">${r.score??'—'}</span>`+
        `<span class="lm-delta">${rd}</span><span class="lm-delta">${sd}</span></div>`;
    });
    tbl.innerHTML=h;
    let n=`数据源：${lm.source}`;
    if(c.stale)n+=` ⚠️ 该榜今日未更新，显示 ${c.stale_date} 快照`;
    if(!c.baseline_date)n+='　｜ 环比基线建立中（约30天后显示 vs 上月变动）';
    else n+=`　｜ 环比基线：${c.baseline_date}`;
    note.textContent=n;
  }
  slugs.forEach((slug,i)=>{
    const b=document.createElement('div'); b.className='lm-tab'+(i===0?' active':'');
    b.dataset.slug=slug; b.textContent=cats[slug].name;
    b.onclick=()=>draw(slug); tabs.appendChild(b);
  });
  if(slugs.length)draw(slugs[0]);
}

// ── 年度里程碑时间线 ──
function renderTL(tl){
  const secs=tl.sectors||[];
  document.getElementById('tlWindow').textContent=(tl._meta&&tl._meta.window)||'';
  const tabs=document.getElementById('tlTabs'), body=document.getElementById('tlBody'), sum=document.getElementById('tlSummary');
  function draw(slug){
    [...tabs.children].forEach(t=>t.classList.toggle('active',t.dataset.slug===slug));
    const s=secs.find(x=>x.slug===slug); if(!s)return;
    sum.textContent=s.summary||'';
    // 时间倒序(最新在上)
    const evs=[...s.events].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    body.innerHTML='<div class="tl-line">'+evs.map(e=>
      `<div class="tl-item"><div class="tl-date">${e.date}</div>`+
      `<div class="tl-title"><a href="${e.source_url}" target="_blank">${e.title}</a></div>`+
      `<div class="tl-impact">${e.impact||''}</div></div>`).join('')+'</div>';
  }
  secs.forEach((s,i)=>{
    const b=document.createElement('div'); b.className='lm-tab'+(i===0?' active':'');
    b.dataset.slug=s.slug; b.textContent=(s.icon?s.icon+' ':'')+s.name;
    b.onclick=()=>draw(s.slug); tabs.appendChild(b);
  });
  if(secs.length)draw(secs[0].slug);
}
